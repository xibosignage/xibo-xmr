name: Test

on:
  pull_request:
  push:
    branches:
      - master
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        run: tests/run.sh
